name: Build FENIX PROMPTER APK

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'fenix-prompter-android/**'
      - '.github/workflows/build-fenix-prompter-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT_DIR: fenix-prompter-android

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon clean assembleDebug

      - name: Rename APK
        run: |
          mkdir -p output
          cp "${PROJECT_DIR}/app/build/outputs/apk/debug/app-debug.apk" output/FENIX-PROMPTER-v1.0.0.apk
          sha256sum output/FENIX-PROMPTER-v1.0.0.apk > output/FENIX-PROMPTER-v1.0.0.apk.sha256

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: FENIX-PROMPTER-APK
          path: output/*
          if-no-files-found: error
          retention-days: 30
