name: Build FENIX LIVE AI APK
on:
  workflow_dispatch:
  push:
    branches: [fenix-live-ai-mvp]
    paths: ['live-ai-android/**', '.github/workflows/android-apk.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: live-ai-android
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: FenixLiveAI-debug-apk
          path: live-ai-android/app/build/outputs/apk/debug/app-debug.apk
