name: Build Fenix Growth Android

on:
  push:
    branches: [ main ]
    paths:
      - 'android-publicacoes/**'
      - '.github/workflows/fenix-growth-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle -p android-publicacoes assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Fenix-Growth-Android
          path: android-publicacoes/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
